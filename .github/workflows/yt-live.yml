name: yt-live
# Muse 2026-11-23: build the YouTube live m3u here (same code as the youtube Worker, generated file)
# and push it to yt.xlat.kdns.fr. The Worker keeps building itself whenever this copy is > 30 min old.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
concurrency:
  group: yt-live
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/muse
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and push
        id: b
        env:
          YT_PUSH: ${{ secrets.YT_PUSH }}
        run: node .github/muse/yt_build.mjs
      - name: Report to status hub
        if: ${{ always() }}
        continue-on-error: true
        env:
          RK: ${{ secrets.RK_GH }}
        run: |
          R=ok; [ "${{ steps.b.outcome }}" = success ] || R=fail
          node .github/muse/hub_report.js yt-live "$R" "$(cat yt_summary.txt 2>/dev/null || echo no summary)"
